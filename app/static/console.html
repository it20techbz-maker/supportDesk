<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Desk Test Console</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b2430; --muted: #5b6776;
    --line: #dfe3e8; --accent: #0b6e6e; --soft: #eef2f4;
    --warn: #b4530a; --warn-bg: #fdf1e3; --bad: #b3261e; --in: #eef2f4; --out: #dff3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b; --card: #1a2027; --text: #e8ecf0; --muted: #9aa6b2;
      --line: #2b343e; --accent: #4fc3c3; --soft: #222a33;
      --warn: #f0a04b; --warn-bg: #33261a; --bad: #f2807a; --in: #222a33; --out: #17362f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .notice { border-left: 3px solid var(--accent); background: var(--card); padding: 10px 14px; border-radius: 0 8px 8px 0; color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .tile b { display: block; font-size: 1.4rem; }
  .tile span { color: var(--muted); font-size: .8rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
  input[type=text], select, textarea { width: 100%; margin-top: 4px; font: inherit; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  textarea { min-height: 96px; resize: vertical; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 12px; border: 1px solid var(--line); background: var(--soft); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  button.small { padding: 3px 9px; font-size: .8rem; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .item { border-top: 1px solid var(--line); padding: 12px 0; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .meta { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  .pill { display: inline-block; font-size: .72rem; font-weight: 600; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--line); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .bubble { padding: 8px 12px; border-radius: 10px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 88%; }
  .bubble.in { background: var(--in); }
  .bubble.out { background: var(--out); margin-left: auto; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; background: var(--soft); padding: 10px; border-radius: 8px; margin: 6px 0 0; }
  .empty { color: var(--muted); font-size: .9rem; }
  .err { color: var(--bad); font-size: .85rem; min-height: 1.2em; }
  details summary { cursor: pointer; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .tiles { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Support Desk Test Console</h1>
  <p class="sub">Type a customer message and see what the tool would do with it.</p>
  <p class="notice"><span id="modeNote"></span> <span id="aiNote"></span></p>

  <div class="tiles" id="tiles"></div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>1. Customer sends a message</h2>
        <label>From<select id="phone"></select></label>
        <label>Message<textarea id="text"></textarea></label>
        <label class="row" style="color:inherit"><input type="checkbox" id="voice"> This is a voice note</label>
        <div class="row">
          <button class="primary" id="send">Send as customer</button>
          <button class="small" data-sample="log">Sample: log handover</button>
          <button class="small" data-sample="issue">Sample: issue</button>
          <button class="small" data-sample="feature">Sample: feature question</button>
          <button class="small" data-sample="angry">Sample: upset customer</button>
        </div>
        <div class="err" id="err"></div>
      </div>

      <div class="card">
        <h2>WhatsApp conversation</h2>
        <div id="chat"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>2. Replies waiting for approval</h2>
        <label>Your name (recorded with every approval)<input type="text" id="approver"></label>
        <div class="err" id="err2"></div>
        <div id="queue"></div>
      </div>

      <div class="card">
        <h2>3. Tickets</h2>
        <div class="row" style="margin-bottom:10px">
          <label class="row" style="color:inherit;margin:0"><input type="checkbox" id="down"> Simulate ticketing system down</label>
          <button class="small" id="retry">Retry waiting tickets</button>
        </div>
        <div id="tickets"></div>
      </div>

      <div class="card">
        <h2>Emails to the support team</h2>
        <div id="emails"></div>
      </div>

      <details class="card">
        <summary>Audit log</summary>
        <div id="audit" style="margin-top:10px"></div>
      </details>
    </div>
  </div>
</main>

<script>
(function () {
  var SAMPLES = {
    log: "Please check this date : 02/10/2026, production issue happen that cron job : UT67890 run long time\nLog in path on the share uploaded server:\n/A_Bank/Log/Prod/ UT67890.log",
    issue: "The UAT month end report total is wrong since yesterday.",
    feature: "How do I export the daily settlement report to Excel?",
    angry: "This is unacceptable. Let me speak to a manager."
  };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function when(ts) { return esc(String(ts || '').replace('T', ' ')); }
  function api(method, url, body) {
    return fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || 'Request failed'); return j; }); });
  }
  function fail(e) { $('err').textContent = e.message; }

  function render(s) {
    $('modeNote').textContent = s.whatsapp_live
      ? 'WhatsApp is LIVE through the Baileys bridge: replies are really sent to numbers on the allowed list. Tickets and emails are still only recorded on this page.'
      : 'Test mode. Nothing here reaches WhatsApp, the ticketing system or email. Replies, tickets and emails are only recorded on this page.';
    $('aiNote').textContent = s.ai_enabled ? 'AI wording is ON.' : 'AI wording is off: replies use fixed rules and templates.';
    var st = s.stats, msgs = 0, open = st.tickets_by_status.open || 0;
    Object.keys(st.messages_by_type).forEach(function (k) { msgs += st.messages_by_type[k]; });
    $('tiles').innerHTML =
      '<div class="tile"><b>' + msgs + '</b><span>messages received</span></div>' +
      '<div class="tile"><b>' + open + '</b><span>tickets awaiting root cause</span></div>' +
      '<div class="tile"><b>' + st.awaiting_approval + '</b><span>replies awaiting approval</span></div>' +
      '<div class="tile"><b>' + st.waiting_for_ticket_system + '</b><span>waiting for ticket system</span></div>';

    var sel = $('phone'), current = sel.value;
    sel.innerHTML = s.customers.map(function (c) {
      return '<option value="+' + esc(c.phone) + '">' + esc(c.company) + ' (' + esc(c.type) + ' customer)</option>';
    }).join('') + '<option value="+60199999999">Unknown number</option>';
    if (current) sel.value = current;
    $('down').checked = s.ticketing_down;

    var events = s.inbound.map(function (m) { return { ts: m.ts, id: m.id, dir: 'in', phone: m.phone, body: m.text || '(voice note)', tag: m.type }; })
      .concat(s.outbox.filter(function (o) { return o.status === 'sent' || o.status === 'failed'; }).map(function (o) {
        return { ts: o.sent_ts, id: o.id, dir: 'out', phone: o.phone, body: o.body, tag: (o.status === 'failed' ? 'NOT SENT, ' : '') + o.kind + (o.via === 'template' ? ', template message' : '') + ', ' + o.approved_by };
      }));
    events.sort(function (a, b) { return a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : (a.dir === b.dir ? b.id - a.id : (a.dir === 'out' ? -1 : 1)); });
    $('chat').innerHTML = events.length ? events.map(function (e) {
      return '<div class="meta" style="text-align:' + (e.dir === 'out' ? 'right' : 'left') + '">' + when(e.ts) + ' · ' +
        (e.dir === 'in' ? 'from ' : 'to ') + esc(e.phone) + ' · <span class="pill">' + esc(e.tag) + '</span></div>' +
        '<div class="bubble ' + e.dir + '">' + esc(e.body) + '</div>';
    }).join('') : '<p class="empty">No messages yet. Try one of the samples.</p>';

    var pending = s.outbox.filter(function (o) { return o.status === 'pending_approval'; });
    $('queue').innerHTML = pending.length ? pending.map(function (o) {
      return '<div class="item"><div class="meta">' + when(o.ts) + ' · to ' + esc(o.phone) + ' · <span class="pill">' + esc(o.kind) + '</span></div>' +
        '<textarea id="draft' + o.id + '">' + esc(o.body) + '</textarea>' +
        '<div class="row" style="margin-top:6px"><button class="primary small" data-approve="' + o.id + '">Approve and send</button>' +
        '<button class="small" data-reject="' + o.id + '">Reject</button></div></div>';
    }).join('') : '<p class="empty">Nothing waiting.</p>';

    var due = {};
    s.reminders.forEach(function (t) { due[t.id] = 1; });
    $('tickets').innerHTML = s.tickets.length ? s.tickets.map(function (t) {
      return '<div class="item"><div class="meta">' + when(t.ts) + ' · ' + esc(t.company) + '</div>' +
        '<b>' + esc(t.ext_id) + '</b> <span class="pill' + (t.priority === 'MODERATE' ? '' : ' warn') + '">' + esc(t.priority) + '</span> ' +
        '<span class="pill">' + esc(t.status.replace(/_/g, ' ')) + '</span>' +
        (t.settle_by ? ' <span class="pill' + (due[t.id] ? ' warn' : '') + '">settle by ' + esc(t.settle_by) + (due[t.id] ? ', due soon' : '') + '</span>' : '') +
        '<pre>' + esc(t.body) + '</pre>' +
        (t.root_cause ? '<div class="meta" style="margin-top:6px">Root cause: ' + esc(t.root_cause) + '</div>' :
          '<div class="row" style="margin-top:8px"><input type="text" id="cause' + t.id + '" placeholder="Support team: root cause" style="flex:1;min-width:160px;margin:0">' +
          '<button class="small" data-cause="' + t.id + '">Post root cause</button></div>') + '</div>';
    }).join('') : '<p class="empty">No tickets yet.</p>';

    $('emails').innerHTML = s.emails.length ? s.emails.map(function (e) {
      return '<details class="item"><summary>' + esc(e.subject) + '</summary><div class="meta">' + when(e.ts) + ' · to ' + esc(e.recipient) + '</div><pre>' + esc(e.body) + '</pre></details>';
    }).join('') : '<p class="empty">No emails yet.</p>';

    $('audit').innerHTML = s.audit.map(function (a) {
      return '<div class="meta">' + when(a.ts) + ' · ' + esc(a.event) + ' · ' + esc(a.detail) + '</div>';
    }).join('') || '<p class="empty">Empty.</p>';
  }

  function refresh() { return api('GET', '/api/state').then(render); }
  function approver() {
    var name = $('approver').value.trim();
    if (!name) { $('err2').textContent = 'Enter your name before approving or rejecting.'; $('approver').focus(); }
    return name;
  }

  $('send').addEventListener('click', function () {
    $('err').textContent = '';
    api('POST', '/api/incoming', { phone: $('phone').value, text: $('text').value, voice_note: $('voice').checked })
      .then(function () { $('text').value = ''; $('voice').checked = false; return refresh(); }).catch(fail);
  });
  $('down').addEventListener('change', function () { api('POST', '/api/ticketing-down', { down: $('down').checked }).then(refresh).catch(fail); });
  $('retry').addEventListener('click', function () { api('POST', '/api/retry').then(refresh).catch(fail); });
  document.addEventListener('click', function (e) {
    var d = e.target.dataset || {}, name;
    $('err').textContent = '';
    $('err2').textContent = '';
    if (d.sample) {
      $('text').value = SAMPLES[d.sample];
      if (d.sample !== 'log') $('phone').selectedIndex = d.sample === 'issue' ? 1 : 0;
    } else if (d.approve) {
      if ((name = approver())) api('POST', '/api/outbox/' + d.approve + '/approve', { approver: name, body: $('draft' + d.approve).value }).then(refresh).catch(fail);
    } else if (d.reject) {
      if ((name = approver())) api('POST', '/api/outbox/' + d.reject + '/reject', { approver: name }).then(refresh).catch(fail);
    } else if (d.cause) {
      api('POST', '/api/tickets/' + d.cause + '/root-cause', { cause: $('cause' + d.cause).value }).then(refresh).catch(fail);
    }
  });
  refresh().catch(fail);
})();
</script>
</body>
</html>
